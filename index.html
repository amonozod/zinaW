let AT='questions', AQ={ sec:'all', search:'' }, IMPORT_PREVIEW=null;
function normSec(v){ v=String(v||'').toLowerCase(); return /math|^m$/.test(v)?'M':'RW'; }
function normDiff(v){ v=String(v||'').toLowerCase(); return v.startsWith('e')?'Easy':v.startsWith('h')?'Hard':'Medium'; }
function normalizeQ(o){
  const choices = Array.isArray(o.choices)&&o.choices.length ? o.choices.map(String) : ['A','B','C','D'].map(k=>o[k]??o[k.toLowerCase()]).filter(x=>x!=null&&x!=='').map(String);
  const sec=normSec(o.section);
  let domain = o.domain||'';
  const match = DOMAINS[sec].find(d=>d.toLowerCase()===String(domain).toLowerCase()) || DOMAINS[sec].find(d=>d.toLowerCase().includes(String(domain).toLowerCase().slice(0,6)) && domain);
  const q = { id:o.id||('q_'+uid()), section:sec, domain: match||DOMAINS[sec][0], difficulty:normDiff(o.difficulty), tier: String(o.tier||'free').toLowerCase().startsWith('p')?'premium':'free',
    type: choices.length?'mcq':'spr', passage:String(o.passage||'').trim(), stem:String(o.stem||o.question||o.q||'').trim(), choices, answer:String(o.answer||'').trim(), explanation:String(o.explanation||'').trim(), image:o.image||'', status:o.status||'visible', created:o.created||Date.now() };
  if(q.type==='mcq') q.answer=q.answer.toUpperCase().replace(/[^A-D]/g,'').slice(0,1);
  const errs=[]; if(!q.stem) errs.push('missing question text'); if(q.type==='mcq'&&q.choices.length!==4) errs.push(`needs 4 choices (found ${q.choices.length})`); if(!q.answer) errs.push('missing answer');
  return { q, errs };
}
/* ---------- smart import: paste anything, Zina splits it ---------- */
function guessSection(txt, choices){
  const s=txt.toLowerCase();
  const mathHits=(s.match(/\$|\bf\(x\)|equation|function|slope|x\^|\by\s*=|value of|triangle|circle|radius|percent|mean|median|probability|graph|\bsolve|sqrt|√|π|\d\s*[+\-*/×÷=]\s*\d/g)||[]).length;
  const numChoices=choices.filter(c=>/^[\s$\-−(]*[\d.\/,√π]+/.test(c)).length;
  const rwHits=(s.match(/\btext\b|passage|author|student|standard english|claim|notes|the word|as used|most logically|researcher|poem|novel|which choice/g)||[]).length;
  return (mathHits+numChoices*2 > rwHits*1.5 || (!choices.length && mathHits)) ? 'M':'RW';
}
function guessDomain(txt, sec){
  const s=txt.toLowerCase();
  if(sec==='M'){
    if(/triangle|circle|angle|radius|diameter|sin|cos|tan|volume|area|perimeter|degrees|radian|polygon|cylinder|sphere|cone|arc/.test(s)) return 'Geometry and Trigonometry';
    if(/percent|%|mean|median|mode|probability|table|survey|rate|ratio|proportion|data|sample|scatterplot|standard deviation|unit|miles|per /.test(s)) return 'Problem-Solving and Data Analysis';
    if(/\^\s*2|²|quadratic|exponential|polynomial|nonlinear|parabola|vertex|\^\{|root|factor|radical/.test(s)) return 'Advanced Math';
    return 'Algebra';
  }
  if(/standard english|conventions|punctuat/.test(s)) return 'Standard English Conventions';
  if(/most logical and precise word|as used in the text|main purpose|overall structure|function of|text 1|text 2|word or phrase/.test(s)) return 'Craft and Structure';
  if(/transition|most logically|student wants|notes|rhetorical|accomplish this goal|while researching/.test(s)) return 'Expression of Ideas';

function smartParse(raw){
  let text=raw.replace(/\r/g,'').replace(/\u00a0/g,' ').trim(); if(!text) return [];

  const key={}; const km=text.match(/\n\s*(?:answer\s*key|answers|javoblar|kalit)\s*:?\s*\n?([\s\S]+)$/i);
  if(km){ const body=km[1]; const pairs=[...body.matchAll(/(\d{1,4})\s*[.)\-:]\s*([A-D]|-?[\d.\/]+)/gi)]; if(pairs.length){ pairs.forEach(m=>key[+m[1]]=m[2]); text=text.slice(0,km.index); } }

    let answer=''; const am=b.match(/^\s*(?:correct\s+answer|answer|ans|javob)\s*(?:is)?\s*[:\-]\s*(.+)$/im); if(am){ answer=am[1].trim().replace(/^\(?([A-D])\)?(\W.*)?$/,'$1').replace(/\s+(or)\s+|\s*,\s*/g,';'); b=b.slice(0,am.index)+b.slice(am.index+am[0].length); }

    else { const lines=stemPart.split('\n'); let qi=-1; for(let k=lines.length-1;k>0;k--){ if(/\?\s*$/.test(lines[k]) || /^\s*(which choice|which|what|how|based on|according to|as used)/i.test(lines[k])){ qi=k; break; } }

    const section=guessSection(all,choices);
    if(section==='M' && passage && passage.length<400){ stem=passage+'\n'+stem; passage=''; }
    const r=normalizeQ({ section, domain:guessDomain(all,section), difficulty:'Medium', tier:'free', passage, question:stem, choices, answer, explanation }); r.n=n; return r;
  });
}
/* ---------- bulk: read PDFs, Word files and text files, then split ---------- */
function loadScript(src){ return new Promise((res,rej)=>{ if(document.querySelector(`script[src="${src}"]`)) return res(); const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
async function pdfText(file){
  if(!window.pdfjsLib){ let base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
    try{ await loadScript(base+'pdf.min.js'); }catch(e){ base='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/'; await loadScript(base+'pdf.min.js'); }
    pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js'; }
  const pdf=await pdfjsLib.getDocument({ data:new Uint8Array(await file.arrayBuffer()) }).promise; let out='';
  for(let p=1;p<=pdf.numPages;p++){ const page=await pdf.getPage(p); const c=await page.getTextContent(); let lastY=null, line='';
    const items=c.items.filter(it=>it.str!==undefined).map(it=>({ s:it.str, x:it.transform[4], y:Math.round(it.transform[5]) }));

    out+=line+'\n\n'; }
  return out;
}
async function docxText(file){

}
async function readAnyFile(f){ const n=f.name.toLowerCase(); if(n.endsWith('.pdf')) return pdfText(f); if(n.endsWith('.docx')) return docxText(f); if(/\.(txt|md|csv|json)$/.test(n)) return f.text(); return null; }
function splitByKeys(text){ // a file can hold several sections, each ending with its own answer key (which may run across pages)
  const lines=text.split('\n'), parts=[]; let buf=[], i=0;
  const isHead=l=>/^\s*(?:answer\s*key|answers|javoblar|kalit)\s*:?\s*$/i.test(l);
  const isPair=l=>/^\s*(?:\d{1,4}\s*[.)\-:]?\s*(?:[A-D]|-?[\d.\/]+)\s*[,;]?\s*)+$/i.test(l);

    if(isHead(l)){ while(i<lines.length && (lines[i].trim()==='' || isPair(lines[i]))) buf.push(lines[i++]); parts.push(buf.join('\n')); buf=[]; } }

const normStem = s => String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().slice(0,160);

/* ---------- answer keys: a key can be its own file, or pages at the end of a file ---------- */
const PAIR_LINE=/^\s*(?:\(?\d{1,3}\)?\s*[.):\-]?\s*(?:[A-D]|-?[\d.\/]+)\s*[,;|]?\s*)+$/i;
function keyPairs(text){ const out=[]; String(text).split('\n').forEach(l=>{ if(!PAIR_LINE.test(l)) return; for(const m of l.matchAll(/\(?(\d{1,3})\)?\s*[.):\-]?\s*([A-D]|-?[\d.\/]+)(?=\s|[,;|]|$)/gi)) out.push({ n:+m[1], answer:m[2].toUpperCase() }); }); return out; }

  .replace(/\b(answer\s*keys?|answers?|keys?|javoblar|kalit|solutions?|explanations?|reading\s*(and|&)\s*writing|reading|writing|english|r\s*&\s*w|rw|math(ematics)?|module\s*\d|m\s*\d|part\s*\d|section\s*\d)\b/gi,' ')

function parseWords(text){
  const out=[]; const lines=String(text).replace(/\r/g,'').split('\n').map(l=>l.replace(/\s+/g,' ').trim());
  const clean=w=>w.replace(/^\s*(\d{1,4}[.)]|[•\-*])\s*/,'').replace(/\s*\((n|v|adj|adv|prep|conj|noun|verb|adjective|adverb)\.?\)\s*/i,' ').replace(/[:;,.\s]+$/,'').trim();
  const isWord=w=>/^[A-Za-z][A-Za-z'\- ]{1,30}$/.test(w) && w.split(' ').length<=3;
  const isEx=l=>/^(example|ex|e\.g|sentence|usage)\s*[:.\-]/i.test(l) || /^["“].+["”]$/.test(l);
  for(let i=0;i<lines.length;i++){ const l=lines[i]; if(!l) continue;
    if(isEx(l) && out.length){ out[out.length-1].ex=l.replace(/^(example|ex|e\.g|sentence|usage)\s*[:.\-]\s*/i,'').replace(/^["“]|["”]$/g,''); continue; }
    let m=l.split(/\t|\s*[|;]\s*/); if(m.length<2 && /,/.test(l) && l.split(',').length<=4 && isWord(clean(l.split(',')[0]))) m=l.split(/\s*,\s*/);
    if(m.length<2) m=l.split(/\s+[-–—=]\s+|\s*:\s+|\s+[-–—]\s*(?=[a-z])/);
    if(m.length>=2 && /^(word|term|vocab(ulary)?)$/i.test(clean(m[0])) && /^(definition|meaning|def)/i.test(m[1].trim())) continue;   // a header row
    if(m.length>=2 && isWord(clean(m[0])) && m[1].length>2){ out.push({ word:clean(m[0]), def:m[1].trim().slice(0,220), ex:(m[2]||'').trim().slice(0,240) }); continue; }
    const w=clean(l); const next=lines[i+1]||'';                                      // two-line format: word, then its meaning
    if(isWord(w) && next && !isWord(clean(next)) && next.length>6 && !isEx(next)){ out.push({ word:w, def:next.slice(0,220), ex:'' }); i++; }
  }
  const have=new Set(allWords().map(w=>(Array.isArray(w)?w[0]:w.word).toLowerCase())); const seen=new Set();
  return out.filter(w=>{ const k=w.word.toLowerCase(); if(have.has(k)||seen.has(k)) return false; seen.add(k); return true; });
}

async function aiSort(raw){
  const sample=S.caps.sample; if(!sample) { toast('AI sorting works when the page is opened in Claude'); return null; }
  const chunks=[]; let cur=''; raw.split(/\n(?=\s*(?:question\s*)?\d{1,4}[.)]\s)/i).forEach(piece=>{ if((cur+piece).length>12000 && cur){ chunks.push(cur); cur=''; } cur+='\n'+piece; }); if(cur.trim()) chunks.push(cur);
  const out=[];
  for(const [i,ch] of chunks.entries()){
    toast(`Sorting part ${i+1} of ${chunks.length}…`);
    const prompt=`You organize SAT questions that a teacher pasted. Split the text into individual questions and return ONLY a JSON array. Copy every passage, question, choice and explanation EXACTLY as written: never rewrite, fix, add, or invent content, and never create questions that are not in the text. If an answer is not given, use "". For each item: {"section":"RW"|"Math","domain":one of ${JSON.stringify([...DOMAINS.RW,...DOMAINS.M])},"difficulty":"Easy"|"Medium"|"Hard" (your best estimate),"passage":"","question":"","choices":["","","",""] or [] for student-produced response,"answer":"A-D or the numeric answer(s) separated by ;","explanation":""}. Keep math in $...$ LaTeX if it is math notation.\n\nTEXT:\n${ch}`;
    try{ const r=await sample.json(prompt,{modelTier:'default'}); (Array.isArray(r)?r:(r.questions||[])).forEach(o=>out.push(o)); }
    catch(e){ toast(e.code==='not_granted'?'AI access was not allowed':'AI could not sort this part'); return out.length?out.map(normalizeQ):null; }
  }
  return out.map(normalizeQ);
}
function parseImport(text){
  text=text.trim(); if(!text) return [];
  if(text[0]==='['||text[0]==='{'){ try{ const j=JSON.parse(text); return (Array.isArray(j)?j:[j]).map(normalizeQ); }catch(e){ return [{q:null,errs:['JSON could not be read: '+e.message]}]; } }
  if(!/^\s*(question|q|stem)\s*:/im.test(text)) return smartParse(text);
  return text.split(/\n\s*-{3,}\s*\n/).map(block=>{
    const o={}; let last=null;
    block.split('\n').forEach(line=>{
      const m=line.match(/^\s*(section|domain|skill|difficulty|level|tier|passage|question|q|stem|answer|explanation|[ABCD])\s*[:)]\s?(.*)$/i);
      if(m){ let k=m[1].toLowerCase(); if(k==='skill') k='domain'; if(k==='level') k='difficulty'; if(k==='q'||k==='stem') k='question'; if(/^[abcd]$/.test(k)) k=k.toUpperCase(); o[k]=m[2]; last=k; }
      else if(last && line.trim()!==''){ o[last]+= '\n'+line; }
      else if(last && (last==='passage'||last==='explanation')){ o[last]+='\n'; }
    });
    return normalizeQ(o);
  });
}

async function compressImage(file){
  const url=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(file); });
  const img=await new Promise((r,j)=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=j; i.src=url; });
  const scale=Math.min(1,900/img.width); const c=document.createElement('canvas'); c.width=img.width*scale; c.height=img.height*scale;
  const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
  let q=.85, out=c.toDataURL('image/jpeg',q); while(out.length>180000&&q>.35){ q-=.1; out=c.toDataURL('image/jpeg',q); } return out;
}

function assembleMock(opts){
  const vis=visibleQuestions(); const usedIds=new Set(S.mocks.flatMap(m=>m.modules.flatMap(x=>[...x.ids,...(x.hardIds||[])])));
  const mods=[];
  ['RW','M'].forEach(s=>{
    let pool=shuffle(vis.filter(q=>q.section===s)); if(opts.fresh) pool.sort((a,b)=>usedIds.has(a.id)-usedIds.has(b.id));
    const n=s==='RW'?opts.rw:opts.m, min=s==='RW'?32:35;
    const take=(pred,k,avoid)=>{ const out=[]; for(const q of pool){ if(out.length>=k) break; if(avoid.has(q.id)) continue; if(pred(q)) out.push(q); } for(const q of pool){ if(out.length>=k) break; if(avoid.has(q.id)||out.includes(q)) continue; out.push(q); } out.forEach(q=>avoid.add(q.id)); return out.map(q=>q.id); };
    const used=new Set();
    const m1=take(()=>true,n,used);
    if(opts.adaptive){ const hard=take(q=>q.difficulty!=='Easy',n,used); const easy=take(q=>q.difficulty!=='Hard',n,used);
      mods.push({section:s,n:1,minutes:min,ids:m1},{section:s,n:2,minutes:min,ids:easy,hardIds:hard}); }
    else mods.push({section:s,n:1,minutes:min,ids:m1},{section:s,n:2,minutes:min,ids:take(()=>true,n,used)});
  });
  return mods.filter(x=>x.ids.length);
}

  bindShell(); if(!S.isAdmin) return;
  $('#aiTest')?.addEventListener('click',async()=>{ const out=$('#aiTestOut'); const say=(ok,msg)=>out.insertAdjacentHTML('beforeend',`<div class="aic-row ${ok?'ok':'no'}"><b>${ok?'✓':'✕'}</b>${msg}</div>`); out.innerHTML='';
    if(window.ZINA){ try{ const h=await fetch(ZINA.config.aiEndpoint||'/api/ai').then(r=>r.json()); say(h.anthropic,h.anthropic?'Anthropic key is set in Vercel':'ANTHROPIC_API_KEY is missing in Vercel → Settings → Environment Variables, then Redeploy'); say(h.supabase,h.supabase?'Server can reach Supabase':'SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is missing in Vercel'); if(!h.anthropic||!h.supabase) return; }catch(e){ return say(false,'The /api/ai server did not answer. Check that the api folder was uploaded to GitHub.'); } }
    if(!S.caps.sample) return say(false,'AI is not available on this page.');
    try{ const r=await S.caps.sample('Reply with just the word OK.',{ modelTier:'quick' }); say(true,'Zina answered: “'+esc(r.text.trim().slice(0,40))+'”'); }
    catch(e){ say(false,'Zina did not answer: '+esc(e.message||e.code||'unknown')+(/upstream/.test(e.message||'')?' (Anthropic refused: check the key and that the account has credit)':'')); } });
  $$('[data-rpx]').forEach(b=>b.onclick=async()=>{ try{ await Data.del('reports',b.dataset.rpx); }catch(e){} route(); });
  if(AT==='payments') bindAdminPayments();
  if(AT==='mocks') bindRealExams();
  $$('[data-at]').forEach(b=>b.onclick=()=>{ AT=b.dataset.at; history.replaceState(null,'','#/admin'); route(); });
  const on=(s,f)=>{ const n=$(s); if(n) n.onclick=f; };
  on('#addQ',()=>questionForm(null, q=>Data.put('questions',q)));
  on('#goImport',()=>{ AT='import'; route(); }); on('#goImport2',()=>{ AT='import'; route(); });
  $('#aqs')?.addEventListener('input',e=>{ AQ.search=e.target.value; clearTimeout(window._aq); window._aq=setTimeout(()=>{ route(); const i=$('#aqs'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); },250); });
  $('#aqsec')?.addEventListener('change',e=>{ AQ.sec=e.target.value; route(); });
  $$('[data-vis]').forEach(b=>b.onclick=async()=>{ const q=S.questions.find(x=>x.id===b.dataset.vis); await Data.put('questions',{...q,status:q.status==='hidden'?'visible':'hidden'}); route(); });
  $$('[data-edit]').forEach(b=>b.onclick=()=>questionForm(S.questions.find(x=>x.id===b.dataset.edit), q=>Data.put('questions',q), 'Edit question'));
  $$('[data-prev]').forEach(b=>b.onclick=()=>startPractice([S.questions.find(x=>x.id===b.dataset.prev)],'Preview',{}));
  $$('[data-delq]').forEach(b=>b.onclick=async()=>{ if(!confirm('Delete this question? Tests that use it will skip it.')) return; await Data.del('questions',b.dataset.delq); route(); });
  $$('[data-draft]').forEach(b=>b.onclick=()=>draftSimilar(S.questions.find(x=>x.id===b.dataset.draft)));
  // import
  $('#bulkFiles')?.addEventListener('change',e=>bulkImport(e.target.files));
  $('#bulkFolder')?.addEventListener('change',e=>bulkImport(e.target.files));
  $('#pickFolder')?.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); $('#bulkFolder').click(); });
  const dz=$('#bulkDrop'); if(dz){ ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.add('over'); })); ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop',async e=>{ const items=[...(e.dataTransfer.items||[])]; const files=[]; const walk=async entry=>{ if(!entry) return; if(entry.isFile){ const f=await new Promise(r=>entry.file(r)); try{ f.relPath=entry.fullPath; }catch(e){} files.push(f); } else if(entry.isDirectory){ const rd=entry.createReader(); let batch; do{ batch=await new Promise(r=>rd.readEntries(r)); for(const en of batch) await walk(en); }while(batch.length); } };
      if(items.length && items[0].webkitGetAsEntry){ for(const it of items) await walk(it.webkitGetAsEntry()); } else files.push(...e.dataTransfer.files); bulkImport(files); }); }
  on('#impParse',()=>{ IMPORT_PREVIEW=parseImport($('#imp').value); if(!IMPORT_PREVIEW.length) return toast('Paste some questions first'); $('#impPrev').innerHTML=importPreviewHTML(); bindPreview(); });
  on('#impAI',async()=>{ const v=$('#imp').value; if(!v.trim()) return toast('Paste some questions first'); const b=$('#impAI'); b.disabled=true; b.textContent='Sorting…'; const r=await aiSort(v); b.disabled=false; b.textContent='✦ Sort with AI'; if(r&&r.length){ IMPORT_PREVIEW=r; $('#impPrev').innerHTML=importPreviewHTML(); bindPreview(); } });
  bindPreview();
  // mocks
  on('#newMock',mockBuilder);
  $$('[data-pub]').forEach(b=>b.onclick=async()=>{ const m=S.mocks.find(x=>x.id===b.dataset.pub); await Data.put('mocks',{...m,status:m.status==='published'?'draft':'published'}); toast(m.status==='published'?'Test unpublished':'Test published to students'); route(); });
  $$('[data-medit]').forEach(b=>b.onclick=()=>mockEditor(S.mocks.find(x=>x.id===b.dataset.medit)));
  $$('[data-mdel]').forEach(b=>b.onclick=async()=>{ if(!confirm('Delete this test? Student results stay.')) return; await Data.del('mocks',b.dataset.mdel); route(); });
  // vocab
  $('#vocabFiles')?.addEventListener('change',e=>vocabImport(e.target.files));
  $('#vocabFolder')?.addEventListener('change',e=>vocabImport(e.target.files));
  $('#vocabPickFolder')?.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); $('#vocabFolder').click(); });
  { const dz=$('#vocabDrop'); if(dz){ ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.add('over'); })); ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{ e.preventDefault(); dz.classList.remove('over'); }));
    dz.addEventListener('drop',async e=>{ const items=[...(e.dataTransfer.items||[])]; const files=[]; const walk=async en=>{ if(!en) return; if(en.isFile) files.push(await new Promise(r=>en.file(r))); else if(en.isDirectory){ const rd=en.createReader(); let b; do{ b=await new Promise(r=>rd.readEntries(r)); for(const x of b) await walk(x); }while(b.length); } }; if(items.length&&items[0].webkitGetAsEntry){ for(const it of items) await walk(it.webkitGetAsEntry()); } else files.push(...e.dataTransfer.files); vocabImport(files); }); } }
  $$('[data-vwx]').forEach(b=>b.onclick=()=>{ VOCAB_PREVIEW.splice(+b.dataset.vwx,1); route(); });
  $('#vocabSave')?.addEventListener('click',async()=>{ const b=$('#vocabSave'); b.disabled=true; const list=VOCAB_PREVIEW.slice(); let n=0; const q=list.slice();
    const work=async()=>{ while(q.length){ const w=q.shift(); try{ await Data.put('words',{ id:'w_'+uid(), word:w.word, def:w.def, ex:w.ex||('Use "'+w.word+'" in a sentence.') }); n++; }catch(e){} if(n%10===0) b.textContent=`Saving ${n} of ${list.length}…`; } };
    await Promise.all(Array.from({length:6},work)); VOCAB_PREVIEW=null; VOCAB_LOG=''; toast(`Added ${n} words for every student`); route(); });
  on('#awS',async()=>{ const lines=$('#aw').value.split('\n').map(l=>l.split(/\s+[-–—]\s+|\t/)).filter(p=>p[0]&&p[1]); for(const [w,d,e] of lines) await Data.put('words',{id:'w_'+uid(),word:w.trim(),def:d.trim(),ex:(e||'').trim()||('Use "'+w.trim()+'" in a sentence.')}); toast(`Added ${lines.length} word${lines.length===1?'':'s'}`); route(); });
  $$('[data-wdel]').forEach(b=>b.onclick=async()=>{ await Data.del('words',b.dataset.wdel); route(); });
  // ai
  on('#aiToggle',async()=>{ const next=!S.settings.aiDrafting; if(next && !confirm('Allow Zina AI to draft questions? Drafts stay hidden from students until you approve each one.')) return; await Data.setSettings({aiDrafting:next}); route(); });
  $$('[data-drej]').forEach(b=>b.onclick=async()=>{ await Data.del('drafts',b.dataset.drej); route(); });
  $$('[data-dok]').forEach(b=>b.onclick=async()=>{ const d=S.drafts.find(x=>x.id===b.dataset.dok); const {sourceId,status,...q}=d; await Data.put('questions',{...q,id:'q_'+uid(),status:'visible'}); await Data.del('drafts',d.id); toast('Approved and added to the bank'); route(); });
  $$('[data-dedit]').forEach(b=>b.onclick=()=>{ const d=S.drafts.find(x=>x.id===b.dataset.dedit); questionForm(d, async q=>{ await Data.put('questions',{...q,id:'q_'+uid(),status:'visible'}); await Data.del('drafts',d.id); }, 'Edit and approve draft'); });
}
function bindImportSave(){ const b=$('#impSave'); if(!b) return; b.onclick=async()=>{
  const ok=IMPORT_PREVIEW.filter(x=>x.q&&!x.errs.length); b.disabled=true; let n=0, fail=0; const bar=$('#saveBar');
  const draw=()=>{ if(bar) bar.innerHTML=`<div class="save-prog"><i style="width:${Math.round((n+fail)/ok.length*100)}%"></i></div><div class="faint" style="font-size:13px;margin-top:6px">Saving ${n} of ${ok.length}…</div>`; b.textContent=`Saving ${n} of ${ok.length}…`; };
  draw(); const queue=ok.slice(); const worker=async()=>{ while(queue.length){ const x=queue.shift(); try{ await Data.put('questions',x.q); n++; }catch(e){ fail++; } if((n+fail)%5===0) draw(); } };
  await Promise.all(Array.from({length:6},worker));
  IMPORT_PREVIEW=null; window.BULK_LOG=''; IMP_FILTER='all'; IMP_SHOW=40; toast(`Saved ${n} question${n===1?'':'s'}${fail?` · ${fail} failed, try again`:''}`); AT='questions'; route(); }; }

/* ================= ROUTER ================= */
function render(){
  const [path, qs] = (location.hash.slice(2)||'').split('?'); const params=new URLSearchParams(qs||''); const r=path||'';
  const app=$('#app');
  if(window.ZINA_ADMIN && r!=='auth' && r!=='admin'){ location.hash='#/admin'; return; }       // admin site: only the panel
  if(r==='admin' && window.ZINA && !window.ZINA_ADMIN){ location.hash='#/app'; return; }        // public site: no panel at all
  const needUser = ['checkout','app','practice','tests','results','schedule','vocab','community','ai','billing','admin'].includes(r);
  if(needUser && !S.user){ location.hash='#/auth'; return; }
  clearInterval(window._cd);
  const views = {
    '':[viewLanding,bindLanding], auth:[viewAuth,bindAuth], app:[viewDashboard,bindDashboard], practice:[viewPractice,bindPractice], tests:[viewTests,bindTests],
    results:[viewResults,bindResults], schedule:[viewSchedule,bindSchedule], community:[viewCommunity,bindCommunity], checkout:[viewCheckout,bindCheckout], vocab:[viewVocab,bindVocab], ai:[viewAI,bindAI], billing:[viewBilling,bindBilling], admin:[viewAdmin,bindAdmin]
  };
  const [v,b]=views[r]||views[''];
  const fresh = r!==window._lastR; window._lastR=r; app.dataset.anim = fresh?'1':'0'; app.dataset.r = r||'landing';
  app.innerHTML=v(params); b(params); typeset(app);
}
let lastRoute='';
function route(){ const h=location.hash; if(h.split('?')[0]!==lastRoute.split('?')[0] && !h.startsWith('#features')) scrollTo(0,0); lastRoute=h; if(r0(h)) render(); }
function r0(h){ return !/^#(features|how|pricing|faq)$/.test(h); }
addEventListener('hashchange', ()=>{ if(r0(location.hash)) { VSESSION=null; route(); } });
route();
initCaps();
</script>
